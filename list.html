<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>List</h1>
    <h2>Ordered Lists</h2>
    <h3>Eastern African countries</h3>
    <ol>
        <li>Kenya</li>
        <li>Uganda</li>
        <li>Tanzania</li>
    </ol>
    <h2>Unordered lists</h2>
    <h3>World continents</h3>
    <ul>
        <li>Africa</li>
        <li>Asia</li>
        <li>Europe</li>
    </ul>
    <h2>Description lists</h2>
    <dl>
        <dt>Apple</dt>
        <dd>A round fruit with red skin</dd>
        <dt>Banana</dt>
        <dd>A long yellow fruit</dd>
    </dl>
</body>
</html>
